<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HAR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo a {
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #38bdf8;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            outline: none;
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .register a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        .back-home a {
            color: #94a3b8;
            text-decoration: none;
        }

        .back-home a:hover {
            color: white;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">
        <a href="{% url 'home' %}">HAR<span>.</span></a>
    </div>

    <p class="subtitle">
        Sign in to your HAR account
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            placeholder="Enter username"
            required
            autofocus
        >

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Sign In
        </button>
    </form>

    <div class="register">
        Don't have an account?
        <a href="{% url 'register' %}">Register now</a>
    </div>

    <div class="back-home">
        <a href="{% url 'home' %}">&larr; Back to Home</a>
    </div>
</div>

</body>
</html>
